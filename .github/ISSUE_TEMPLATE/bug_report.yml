name: Bug report
description: Report a problem with Fikr Vox
body:
  - type: input
    id: version
    attributes:
      label: Fikr Vox version or Git commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS version, Mac model, desktop app or browser server
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include what you expected and what happened.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove API keys, private URLs, and personal media before sharing.
