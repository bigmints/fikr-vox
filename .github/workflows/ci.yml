name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js tests on macOS
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.7'
      - run: npm ci
      - name: Generate About panel resources
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
          node scripts/prepare-local-tts.mjs
          npm run prepare:licenses
      - run: npm test
